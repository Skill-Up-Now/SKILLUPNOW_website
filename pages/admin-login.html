<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Login — Skill Up Now">
  <title>Admin Login — Skill Up Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060614;
      --panel: #0e0c1e;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --border2: rgba(124,92,252,0.4);
      --txt: #f0eeff;
      --txt2: #c8bfff;
      --txt3: #7b73b4;
      --txt4: #4a4470;
      --v1: #7c5cfc;
      --v2: #9b7dff;
      --b1: #3d6bff;
      --grad: linear-gradient(135deg, #7c5cfc 0%, #3d6bff 100%);
      --err: #f87171;
      --ok: #4ade80;
      --r1: 10px; --r2: 16px; --r3: 24px;
    }

    [data-theme="light"] {
      --bg: #f2f0ff;
      --panel: #ffffff;
      --card: rgba(0,0,0,0.03);
      --border: rgba(0,0,0,0.08);
      --border2: rgba(124,92,252,0.3);
      --txt: #0d0b1a;
      --txt2: #2d2756;
      --txt3: #5f589a;
      --txt4: #9b94cb;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--txt);
    }

    /* Subtle background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 20% 20%, rgba(124,92,252,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 80% 80%, rgba(61,107,255,0.1) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* Full-page centered layout */
    .login-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Login card */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1.5px solid var(--border2);
      border-radius: var(--r3);
      padding: 2.5rem 2.5rem 2rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,92,252,0.1);
    }

    /* Logo */
    .login-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }
    .login-logo-icon {
      width: 38px; height: 38px;
      background: var(--grad);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(124,92,252,0.4);
    }
    .login-logo-text {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #c8bfff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Header */
    .login-header {
      margin-bottom: 2rem;
    }
    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--txt);
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .login-sub {
      font-size: 0.85rem;
      color: var(--txt3);
    }

    /* Alert */
    .alert {
      display: none;
      padding: 0.8rem 1rem;
      border-radius: var(--r1);
      font-size: 0.84rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }
    .alert.error   { display: block; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--err); }
    .alert.success { display: block; background: rgba(74,222,128,0.1);  border: 1px solid rgba(74,222,128,0.3);  color: var(--ok); }

    /* Fields */
    .field-wrap { display: flex; flex-direction: column; gap: 1.1rem; margin-bottom: 1.5rem; }
    .field-group { display: flex; flex-direction: column; gap: 0.45rem; }
    .field-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--txt3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .field-input-wrap { position: relative; }
    .field-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.7rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r1);
      color: var(--txt);
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
    }
    .field-input:focus {
      outline: none;
      border-color: var(--v1);
      box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
    }
    .field-input::placeholder { color: var(--txt4); }
    .field-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--txt4);
    }
    .pwd-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--txt4);
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color .2s;
    }
    .pwd-toggle:hover { color: var(--txt2); }

    /* Submit button */
    .sign-in-btn {
      width: 100%;
      padding: 0.92rem;
      background: var(--grad);
      color: white;
      border: none;
      border-radius: var(--r1);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: filter .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(124,92,252,0.4);
      margin-bottom: 1.25rem;
    }
    .sign-in-btn:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,92,252,0.55); }
    .sign-in-btn:active { transform: translateY(0); }
    .sign-in-btn.loading { opacity: 0.65; pointer-events: none; }

    /* Back link */
    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      color: var(--txt3);
      font-size: 0.83rem;
      font-weight: 500;
      text-decoration: none;
      padding: 0.4rem;
      transition: color .2s;
    }
    .back-link:hover { color: var(--v2); }

    /* Spinner */
    .btn-spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile */
    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.5rem 1.5rem; }
      .login-title { font-size: 1.5rem; }
    }
  </style>
  <script>
    if (window.location.protocol !== 'file:') {
      var p = window.location.pathname;
      if (p.endsWith('.html')) history.replaceState(null, '', p.replace(/\.html$/, ''));
    }
  </script>
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="login-logo-text">SkillUpNow</span>
    </div>

    <!-- Header -->
    <div class="login-header">
      <h1 class="login-title">Admin Sign In</h1>
      <p class="login-sub">Access the admin dashboard</p>
    </div>

    <!-- Alert -->
    <div id="alert" class="alert"></div>

    <!-- Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field-wrap">

        <!-- Email -->
        <div class="field-group">
          <label class="field-label" for="email">Email Address</label>
          <div class="field-input-wrap">
            <input class="field-input" type="email" id="email" name="email"
              placeholder="admin@skillupnow.com" required autocomplete="email">
            <span class="field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="field-input-wrap">
            <input class="field-input" type="password" id="password" name="password"
              placeholder="Enter your password" required autocomplete="current-password">
            <span class="field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <button type="button" class="pwd-toggle" id="pwdToggle" onclick="togglePwd()" tabindex="-1" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

      </div>

      <button type="submit" class="sign-in-btn" id="loginBtn">Sign In</button>
    </form>

    <a href="../index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Back to website
    </a>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase-config.js"></script>

<script>
  function togglePwd() {
    const inp = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`;
    } else {
      inp.type = 'password';
      icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>`;
    }
  }

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.className = 'alert ' + type;
    el.textContent = msg;
  }

  async function handleLogin(event) {
    event.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');

    if (!email || !password) { showAlert('Please enter both email and password.', 'error'); return; }

    btn.disabled = true;
    btn.classList.add('loading');
    btn.innerHTML = '<span class="btn-spinner"></span>Verifying…';

    try {
      const result = await window.supabaseConfig.signIn(email, password);
      if (!result.success) {
        showAlert(result.error || 'Login failed. Please try again.', 'error');
        resetBtn(); return;
      }

      const user       = result.data.user;
      const adminCheck = await window.supabaseConfig.checkAdminAccess(user.id);
      if (!adminCheck.isAdmin) {
        await window.supabaseConfig.signOut();
        showAlert('Access denied — admin privileges required.', 'error');
        resetBtn(); return;
      }

      showAlert('Access granted. Redirecting…', 'success');
      setTimeout(() => { window.location.href = './admin-dashboard.html'; }, 900);

    } catch (err) {
      console.error('Login error:', err);
      showAlert('An unexpected error occurred. Please try again.', 'error');
      resetBtn();
    }
  }

  function resetBtn() {
    const btn = document.getElementById('loginBtn');
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.textContent = 'Sign In';
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const user = await window.supabaseConfig.getCurrentUser();
      if (user) {
        const adminCheck = await window.supabaseConfig.checkAdminAccess(user.id);
        if (adminCheck.isAdmin) window.location.href = './admin-dashboard.html';
      }
    } catch (e) { console.error('Auth check:', e); }
  });
</script>
</body>
</html>
