<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recorded Sessions — SkillUpNow</title>
  <meta name="description" content="Watch recorded live sessions at your own pace. Premium soft-skills training from India's top coaches.">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ── Page hero ── */
    .rv-hero {
      padding: 8rem 5vw 4rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .rv-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(124,92,252,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .rv-hero-tag {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .3rem .95rem;
      background: rgba(168,85,247,0.12);
      border: 1px solid rgba(168,85,247,0.3);
      border-radius: 50px;
      font-size: .72rem;
      font-weight: 700;
      color: #a855f7;
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      animation: fadeUp .5s ease both;
    }
    .rv-hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 5.5vw, 4.5rem);
      font-weight: 700;
      color: var(--txt);
      line-height: 1.05;
      margin-bottom: 1.1rem;
      animation: fadeUp .6s .1s ease both;
    }
    .rv-hero p {
      font-size: 1.08rem;
      color: var(--txt3);
      max-width: 560px;
      margin: 0 auto 2.5rem;
      line-height: 1.75;
      animation: fadeUp .6s .2s ease both;
    }

    /* ── Filters ── */
    .rv-filters {
      display: flex;
      gap: .65rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 3rem;
    }
    .rv-filter-btn {
      padding: .5rem 1.2rem;
      border-radius: 50px;
      font-size: .8rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--txt3);
      cursor: pointer;
      font-family: inherit;
      transition: all .22s cubic-bezier(.4,0,.2,1);
    }
    .rv-filter-btn:hover, .rv-filter-btn.active {
      background: rgba(124,92,252,0.12);
      border-color: rgba(124,92,252,0.5);
      color: var(--v1);
    }
    .rv-filter-btn.active {
      background: rgba(124,92,252,0.18);
      border-color: var(--v1);
    }

    /* ── Search ── */
    .rv-search-wrap {
      position: relative;
      max-width: 440px;
      margin: 0 auto 2.5rem;
    }
    .rv-search-wrap svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--txt4);
      pointer-events: none;
    }
    .rv-search {
      width: 100%;
      padding: .82rem 1rem .82rem 2.85rem;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      color: var(--txt);
      font-size: .9rem;
      font-family: inherit;
      outline: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color .22s, box-shadow .22s;
    }
    .rv-search:focus { border-color: var(--v1); box-shadow: 0 0 0 3px rgba(124,92,252,0.12); }
    .rv-search::placeholder { color: var(--txt4); }
    :root[data-theme="light"] .rv-search { background: rgba(255,255,255,0.82); }

    /* ── Video Grid ── */
    .rv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.8rem;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 5vw 5rem;
    }

    /* ── Video Card ── */
    .rv-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(16px) saturate(1.8);
      -webkit-backdrop-filter: blur(16px) saturate(1.8);
      border: 1px solid rgba(124,92,252,0.16);
      border-radius: 24px;
      overflow: hidden;
      transition: transform .38s cubic-bezier(.34,1.56,.64,1), box-shadow .38s ease, border-color .38s ease;
      box-shadow: 0 4px 24px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.06);
      cursor: pointer;
      position: relative;
    }
    .rv-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }
    .rv-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(124,92,252,0.5);
      box-shadow: 0 24px 64px rgba(124,92,252,0.3), 0 4px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    :root[data-theme="light"] .rv-card {
      background: rgba(255,255,255,0.88);
      border-color: rgba(124,92,252,0.12);
      box-shadow: 0 2px 16px rgba(124,92,252,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
    }
    :root[data-theme="light"] .rv-card:hover {
      box-shadow: 0 16px 48px rgba(124,92,252,0.22), 0 4px 12px rgba(0,0,0,0.08);
    }

    /* ── Thumbnail ── */
    .rv-thumb {
      position: relative;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #0d0b1a, #1d1a3e);
      overflow: hidden;
    }
    .rv-thumb-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      opacity: 0.3;
      transition: opacity .3s, transform .4s cubic-bezier(.34,1.56,.64,1);
    }
    .rv-card:hover .rv-thumb-bg { opacity: 0.45; transform: scale(1.12); }
    .rv-thumb-gradient {
      position: absolute;
      inset: 0;
      opacity: 0.7;
    }
    .rv-play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .38s cubic-bezier(.34,1.56,.64,1);
    }
    .rv-card:hover .rv-play-btn { transform: scale(1.12); }
    .rv-play-circle {
      width: 58px;
      height: 58px;
      background: rgba(255,255,255,0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
      transition: background .3s, box-shadow .3s;
    }
    .rv-card:hover .rv-play-circle {
      background: rgba(124,92,252,0.7);
      border-color: rgba(255,255,255,0.5);
      box-shadow: 0 12px 40px rgba(124,92,252,0.5);
    }
    .rv-duration {
      position: absolute;
      bottom: .6rem;
      right: .75rem;
      background: rgba(0,0,0,0.75);
      border-radius: 6px;
      padding: .18rem .55rem;
      font-size: .72rem;
      font-weight: 700;
      color: #fff;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .rv-new-badge {
      position: absolute;
      top: .7rem;
      left: .7rem;
      background: linear-gradient(135deg, #7c5cfc, #3d6bff);
      border-radius: 6px;
      padding: .2rem .6rem;
      font-size: .62rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* ── Card body ── */
    .rv-card-body { padding: 1.4rem 1.5rem 1.6rem; }
    .rv-card-tags { display: flex; gap: .45rem; flex-wrap: wrap; margin-bottom: .75rem; }
    .rv-tag {
      padding: .2rem .65rem;
      background: rgba(124,92,252,0.1);
      border: 1px solid rgba(124,92,252,0.22);
      border-radius: 50px;
      font-size: .66rem;
      font-weight: 700;
      color: var(--v1);
      letter-spacing: .04em;
    }
    .rv-card-title {
      font-size: 1.04rem;
      font-weight: 700;
      color: var(--txt);
      line-height: 1.35;
      margin-bottom: .5rem;
    }
    .rv-card-meta {
      display: flex;
      align-items: center;
      gap: .85rem;
      font-size: .75rem;
      color: var(--txt4);
    }
    .rv-card-mentor { display: flex; align-items: center; gap: .4rem; }
    .rv-mentor-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--v1), var(--b1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .6rem;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }

    /* ── Video Modal ── */
    #rv-modal {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .3s ease, visibility .3s ease;
    }
    #rv-modal.open { opacity: 1; visibility: visible; pointer-events: all; }
    .rv-modal-box {
      width: 100%;
      max-width: 880px;
      background: rgba(13,11,26,0.95);
      border: 1px solid rgba(124,92,252,0.3);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 32px 96px rgba(0,0,0,0.6), 0 4px 16px rgba(124,92,252,0.2);
      transform: scale(0.93) translateY(24px);
      transition: transform .35s cubic-bezier(.23,1,.32,1);
    }
    #rv-modal.open .rv-modal-box { transform: scale(1) translateY(0); }
    :root[data-theme="light"] .rv-modal-box { background: rgba(255,255,255,0.97); border-color: rgba(124,92,252,0.2); }

    .rv-modal-video {
      aspect-ratio: 16/9;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rv-modal-video iframe, .rv-modal-video video {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: auto;
    }
    /* Native video — strip download, PiP, and remote-playback browser controls */
    .rv-modal-video video::-webkit-media-controls-download-button { display: none !important; }
    .rv-modal-video video::-webkit-media-controls-picture-in-picture-button { display: none !important; }
    .rv-modal-video video::-webkit-media-controls-fullscreen-button { }
    /* Prevent drag / selection of content */
    .rv-grid, .rv-modal-box {
      -webkit-user-select: none;
      user-select: none;
    }
    /* Prevent drag-and-drop of iframe/video out of the modal */
    .rv-modal-video iframe,
    .rv-modal-video video {
      -webkit-user-drag: none;   /* Chrome/Safari */
      -webkit-user-select: none; /* Safari */
      user-select: none;
    }
    .rv-modal-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: rgba(255,255,255,0.5);
      font-size: .95rem;
    }
    .rv-modal-placeholder .big-icon { font-size: 3.5rem; }

    .rv-modal-info { padding: 1.5rem 1.8rem; }
    .rv-modal-title { font-size: 1.3rem; font-weight: 800; color: var(--txt); margin-bottom: .4rem; }
    .rv-modal-meta { font-size: .82rem; color: var(--txt4); display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .rv-modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      color: #fff;
      font-size: .85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s, transform .2s;
      z-index: 2;
    }
    .rv-modal-close:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg) scale(1.1); }

    /* ── Empty state ── */
    .rv-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--txt4);
    }
    .rv-empty .rv-empty-icon { font-size: 3.5rem; margin-bottom: 1rem; opacity: .6; }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rv-card { animation: fadeUp .55s ease both; }
    .rv-card:nth-child(2) { animation-delay: .05s; }
    .rv-card:nth-child(3) { animation-delay: .1s; }
    .rv-card:nth-child(4) { animation-delay: .15s; }
    .rv-card:nth-child(5) { animation-delay: .2s; }
    .rv-card:nth-child(6) { animation-delay: .25s; }

    @media (max-width: 640px) {
      .rv-grid { grid-template-columns: 1fr; gap: 1.2rem; }
      .rv-hero h1 { font-size: 2.2rem; }
    }

    /* ── Access-checking spinner ── */
    @keyframes rvSpin { to { rotate: 1turn; } }
    #rv-access-checking {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9990;
      background: rgba(13,11,26,.92);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(124,92,252,.35);
      border-radius: 50px;
      padding: .75rem 1.6rem;
      display: flex; align-items: center; gap: .6rem;
      color: #e9d5ff; font-size: .85rem; font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity .18s ease;
    }
    #rv-access-checking.active { opacity: 1; }
    #rv-access-checking .rv-spin {
      width: 16px; height: 16px;
      border: 2.5px solid rgba(124,92,252,.3);
      border-top-color: #7c5cfc;
      border-radius: 50%;
      animation: rvSpin .65s linear infinite;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="mesh-bg"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <nav></nav>

  <!-- Hero -->
  <section class="rv-hero">
    <div class="rv-hero-tag">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      Recorded Sessions
    </div>
    <h1>Watch. Learn. <span style="background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Grow.</span></h1>
    <p>Every live session recorded for you. Watch premium soft-skills coaching at your own pace, whenever it suits you.</p>

    <!-- Search -->
    <div class="rv-search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="rv-search" type="text" id="rv-search-input" placeholder="Search sessions, topics, mentors…" oninput="filterVideos()">
    </div>

    <!-- Filters — populated dynamically from DB -->
    <div class="rv-filters" id="rv-filters">
      <button class="rv-filter-btn active" data-filter="all" onclick="setFilter('all',this)">All Sessions</button>
    </div>
  </section>

  <!-- Video Grid -->
  <div class="rv-grid" id="rv-grid">
    <!-- populated by JS -->
  </div>

  <!-- Video Modal -->
  <div id="rv-modal" onclick="if(event.target===this)closeModal()">
    <div class="rv-modal-box" style="position:relative;">
      <button class="rv-modal-close" onclick="closeModal()">✕</button>
      <div class="rv-modal-video" id="rv-modal-video">
        <div class="rv-modal-placeholder">
          <div class="big-icon">🎬</div>
          <div>Loading video…</div>
        </div>
      </div>
      <div class="rv-modal-info">
        <div class="rv-modal-title" id="rv-modal-title">Session Title</div>
        <div class="rv-modal-meta">
          <span id="rv-modal-mentor">👤 Mentor</span>
          <span id="rv-modal-dur">⏱ Duration</span>
          <span id="rv-modal-cat">📚 Category</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Access-checking overlay (shown while DB lookup is in flight) -->
  <div id="rv-access-checking">
    <div class="rv-spin"></div>
    Checking access…
  </div>

  <footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/profile-nav.js"></script>

  <script>
  /* ══════════════════════════════════════════════════════════════
     Recording Videos — public listing, per-video access control
     • List is visible to everyone (no login needed)
     • Clicking Watch → checks login → checks payment
     • Paid users: play video with security restrictions
     • Unpaid users: show Razorpay payment prompt
     ══════════════════════════════════════════════════════════════ */

  // Block screenshot shortcuts only inside the video modal (not page-level)
  function blockScreenCapture() {
    const modalOpen = () => document.getElementById('rv-modal')?.classList.contains('open');

    // Block right-click inside modal (prevents "Save video as…" on native video + iframe)
    document.addEventListener('contextmenu', e => {
      if (modalOpen()) e.preventDefault();
    });

    // Block screenshot / devtools / print shortcuts while video is playing
    document.addEventListener('keydown', e => {
      if (!modalOpen()) return;
      if (e.key === 'PrintScreen') { navigator.clipboard?.writeText(''); e.preventDefault(); }
      if (e.key === 'F12') e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && ['p','s','u'].includes(e.key.toLowerCase())) e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','c','j'].includes(e.key.toLowerCase())) e.preventDefault();
    });

    // Block print-to-PDF while modal is open
    window.addEventListener('beforeprint', e => {
      if (modalOpen()) e.preventDefault();
    });
  }
  blockScreenCapture();

  let currentFilter = 'all';
  let allVideos = [];

  // ── Provider → gradient + icon ──
  function videoMeta(provider) {
    if (provider === 'youtube')      return { icon: '▶', gradient: 'linear-gradient(135deg,#ff4e50,#f9d423)' };
    if (provider === 'google_drive') return { icon: '📁', gradient: 'linear-gradient(135deg,#4285f4,#34a853)' };
    if (provider === 'vimeo')        return { icon: '🎬', gradient: 'linear-gradient(135deg,#1ab7ea,#0075b2)' };
    return { icon: '🎥', gradient: 'linear-gradient(135deg,#7c5cfc,#3d6bff)' };
  }

  // ── Skeleton placeholders while loading ──
  function showSkeleton() {
    const grid = document.getElementById('rv-grid');
    if (!grid) return;
    grid.innerHTML = Array.from({length: 6}, () => `
      <div class="rv-card" style="pointer-events:none;">
        <div class="rv-thumb" style="background:var(--panel2);border-radius:var(--r2) var(--r2) 0 0;">
          <div style="position:absolute;inset:0;background:linear-gradient(90deg,var(--panel2) 25%,rgba(124,92,252,.08) 50%,var(--panel2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:inherit;"></div>
        </div>
        <div class="rv-card-body" style="display:flex;flex-direction:column;gap:.65rem;">
          <div style="height:12px;width:60%;background:var(--panel2);border-radius:6px;animation:shimmer 1.4s .1s infinite;background-size:200% 100%;background-image:linear-gradient(90deg,var(--panel2) 25%,rgba(124,92,252,.08) 50%,var(--panel2) 75%);"></div>
          <div style="height:16px;width:90%;background:var(--panel2);border-radius:6px;animation:shimmer 1.4s .2s infinite;background-size:200% 100%;background-image:linear-gradient(90deg,var(--panel2) 25%,rgba(124,92,252,.08) 50%,var(--panel2) 75%);"></div>
          <div style="height:12px;width:50%;background:var(--panel2);border-radius:6px;animation:shimmer 1.4s .3s infinite;background-size:200% 100%;background-image:linear-gradient(90deg,var(--panel2) 25%,rgba(124,92,252,.08) 50%,var(--panel2) 75%);"></div>
        </div>
      </div>`).join('');
  }

  // ── Per-card access badge (set by checkUserAccess after login) ──
  // 'full'  → admin-granted OR paid → green "Access Granted"
  // anything else → purple lock "Members Only" (click to pay)
  function rvAccessBadge(v) {
    if (v._access === 'full') {
      return `<div style="position:absolute;top:.55rem;right:.55rem;background:rgba(34,197,94,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:50px;padding:.25rem .6rem;display:flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;color:#4ade80;border:1px solid rgba(34,197,94,.4);">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        Access Granted
      </div>`;
    }
    return `<div style="position:absolute;top:.55rem;right:.55rem;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:50px;padding:.25rem .6rem;display:flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;color:#e9d5ff;border:1px solid rgba(168,85,247,.35);">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Members Only
    </div>`;

  // ── Render video grid ──
  function renderVideos() {
    const q = document.getElementById('rv-search-input')?.value?.toLowerCase() || '';
    const filtered = allVideos.filter(v => {
      const matchCat = currentFilter === 'all' || v.filterKey === currentFilter;
      const matchQ = !q || v.title.toLowerCase().includes(q) || v.courseTitle.toLowerCase().includes(q) || (v.tags||[]).some(t => t.toLowerCase().includes(q));
      return matchCat && matchQ;
    });
    const grid = document.getElementById('rv-grid');
    if (!grid) return;
    if (!filtered.length) {
      grid.innerHTML = `<div class="rv-empty"><div class="rv-empty-icon">🎬</div><p style="font-size:1.05rem;font-weight:600;color:var(--txt3);margin-bottom:.5rem;">No sessions found</p><p style="font-size:.88rem;">Try adjusting your search or filter.</p></div>`;
      return;
    }
    grid.innerHTML = filtered.map((v, i) => `
      <div class="rv-card" style="animation-delay:${i*0.05}s" onclick="handleWatchClick('${v.id}')">
        <div class="rv-thumb">
          ${v.thumbnail
            ? `<img src="${v.thumbnail}" alt="${v.title}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" loading="lazy" onerror="this.style.display='none'">`
            : `<div class="rv-thumb-bg">${v.icon}</div><div class="rv-thumb-gradient" style="background:${v.gradient};opacity:.55;"></div>`
          }
          <div class="rv-play-btn">
            <div class="rv-play-circle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" style="margin-left:3px"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
          </div>
          ${v.duration !== '—' ? `<div class="rv-duration">⏱ ${v.duration}</div>` : ''}
          ${v.isNew ? '<div class="rv-new-badge">New</div>' : ''}
          ${rvAccessBadge(v)}
        </div>
        <div class="rv-card-body">
          <div class="rv-card-tags">${(v.tags||[]).map(t=>`<span class="rv-tag">${t}</span>`).join('')}</div>
          <div class="rv-card-title">${v.title}</div>
          ${v.totalPrice != null ? `<div style="display:flex;align-items:center;gap:.5rem;margin:.45rem 0;">
            <span style="background:linear-gradient(135deg,#7c5cfc,#3d6bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;font-size:1.02rem;">₹${Number(v.totalPrice).toLocaleString('en-IN')}</span>
            <span style="font-size:.65rem;color:var(--txt4);font-weight:600;background:rgba(124,92,252,.1);border:1px solid rgba(124,92,252,.2);padding:.1rem .42rem;border-radius:50px;">incl. GST</span>
          </div>` : ''}
          <div class="rv-card-meta">
            <div class="rv-card-mentor">
              <div class="rv-mentor-dot">${(v.courseTitle||'S').charAt(0).toUpperCase()}</div>
              <span>${v.courseTitle || 'SkillUpNow'}</span>
            </div>
            <span style="margin-left:auto;background:linear-gradient(135deg,#7c5cfc,#3d6bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;font-size:.82rem;">▶ Watch</span>
          </div>
        </div>
      </div>`).join('');
  }

  // ── Build dynamic filter buttons from loaded courses ──
  function buildFilterButtons() {
    const filtersEl = document.getElementById('rv-filters');
    if (!filtersEl) return;
    const uniqueCourses = [...new Map(allVideos.filter(v => v.courseTitle).map(v => [v.filterKey, v.courseTitle])).entries()];
    let html = `<button class="rv-filter-btn active" data-filter="all" onclick="setFilter('all',this)">All Sessions</button>`;
    uniqueCourses.forEach(([key, name]) => {
      html += `<button class="rv-filter-btn" data-filter="${key}" onclick="setFilter('${key}',this)">${name}</button>`;
    });
    filtersEl.innerHTML = html;
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.rv-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderVideos();
  }

  function filterVideos() { renderVideos(); }

  // ── Access check: login → payment/access → fetch URL → play ──
  async function handleWatchClick(id) {
    const v = allVideos.find(x => x.id === id);
    if (!v) return;

    const client = window.supabaseConfig?.client;
    if (!client) { showVideoGate(v, 'noClient'); return; }

    const spinner = document.getElementById('rv-access-checking');
    spinner?.classList.add('active');

    try {
      const { data: { session } } = await client.auth.getSession();
      if (!session?.user) {
        showVideoGate(v, 'login');
        return;
      }

      // Logged in — check course-specific enrollment / payment
      const userId = session.user.id;
      let hasAccess = false;

      // ── ACCESS RULES ─────────────────────────────────────────────
      // 1. Admin-granted enrollment: enrollment for THIS course where
      //    enrollment_status='active' AND access_status='active'.
      //    → User is enrolled AND admin has explicitly granted access.
      //    → Can watch for FREE (no payment needed).
      //
      // 2. Completed payment for THIS course (via Razorpay or manual).
      //    → Can watch immediately.
      //
      // 3. Everything else (enrolled but access_status != 'active',
      //    not enrolled, or different course) → payment gate.
      // ─────────────────────────────────────────────────────────────
      if (v.courseId) {
        // Check 1 — admin-granted access for this exact course
        const { data: enr } = await client.from('enrollments')
          .select('id')
          .eq('student_user_id', userId)
          .eq('course_id', v.courseId)
          .eq('enrollment_status', 'active')
          .eq('access_status', 'active')
          .limit(1);
        if (enr?.length) hasAccess = true;

        // Check 2 — completed payment for this exact course
        if (!hasAccess) {
          const { data: pay } = await client.from('payments')
            .select('id')
            .eq('student_user_id', userId)
            .eq('course_id', v.courseId)
            .in('payment_status', ['success', 'completed'])
            .limit(1);
          if (pay?.length) hasAccess = true;
        }
      }
      // Note: recordings without a courseId require payment to access
      // (no free fallback for uncategorized recordings)

      if (hasAccess) {
        // ── Fetch video URL now that access is confirmed ──
        // external_url is not loaded during listing to prevent leakage.
        const { data: rec } = await client.from('live_recordings')
          .select('external_url')
          .eq('id', id)
          .single();
        if (rec?.external_url) v.videoUrl = rec.external_url;
        playVideo(v);
      } else {
        showVideoGate(v, 'payment');
      }
    } catch(e) {
      console.error('handleWatchClick error:', e);
      showVideoGate(v, 'payment');
    } finally {
      spinner?.classList.remove('active');
    }
  }

  let _gateVideo = null, _gateCourse = null, _gateTotalAmount = 0;

  // ── Re-attempt watch after login ──
  // modal login fires pn-login-success; OAuth redirect fires window focus
  async function _onLoginResume() {
    if (window._pendingVideoId) {
      const vid = window._pendingVideoId;
      window._pendingVideoId = null;
      handleWatchClick(vid);
    } else {
      checkUserAccess(); // refresh per-card badges
    }
  }
  document.addEventListener('pn-login-success', _onLoginResume);
  // Focus only handles OAuth redirect case — when the user was sent to a login page
  // and returns. We ONLY act if a pending video was set before the redirect.
  // Without this guard every tab-switch would trigger unnecessary DB calls.
  window.addEventListener('focus', async () => {
    if (!window._pendingVideoId) return;
    try {
      const { data: { session } } = await window.supabaseConfig?.client?.auth?.getSession() || { data: {} };
      if (session?.user) _onLoginResume();
    } catch(_) {}
  });

  // ── Bottom toast notification ──
  function _showRvToast(msg, type = 'success') {
    const colors = {
      success: { bg: 'rgba(34,197,94,.18)',   border: 'rgba(34,197,94,.4)',   text: '#4ade80' },
      error:   { bg: 'rgba(239,68,68,.18)',   border: 'rgba(239,68,68,.4)',   text: '#f87171' },
      info:    { bg: 'rgba(124,92,252,.18)',  border: 'rgba(124,92,252,.4)', text: '#a78bfa' },
    };
    const c = colors[type] || colors.info;
    const t = document.createElement('div');
    t.style.cssText = `position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);z-index:99999;background:${c.bg};-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1.5px solid ${c.border};border-radius:50px;padding:.7rem 1.5rem;font-size:.85rem;font-weight:600;color:${c.text};box-shadow:0 8px 32px rgba(0,0,0,.4);white-space:nowrap;transition:opacity .4s ease,transform .4s ease;opacity:0;pointer-events:none;`;
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)'; });
    setTimeout(() => {
      t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)';
      setTimeout(() => t.remove(), 400);
    }, 3500);
  }

  // ── Fetch per-user access state and re-render badges ──
  async function checkUserAccess() {
    const client = window.supabaseConfig?.client;
    if (!client) return;
    try {
      const { data: { session } } = await client.auth.getSession();
      if (!session?.user) return;
      const userId = session.user.id;

      // Fetch enrollments — only active enrollment_status matters for access
      const { data: enrollments } = await client.from('enrollments')
        .select('course_id, access_status, enrollment_status')
        .eq('student_user_id', userId)
        .eq('enrollment_status', 'active');

      const courseAccess = {};
      (enrollments || []).forEach(e => {
        if (e.access_status === 'active') {
          // Admin explicitly granted access — enrolled AND access granted → free to play
          courseAccess[e.course_id] = 'full';
        }
        // Enrolled but access_status != 'active' means admin hasn't granted
        // free access yet — user must pay. No special badge for this state.
      });

      // Completed payments also grant full access
      const { data: payments } = await client.from('payments')
        .select('course_id')
        .eq('student_user_id', userId)
        .in('payment_status', ['success', 'completed']);
      (payments || []).forEach(p => { if (p.course_id) courseAccess[p.course_id] = 'full'; });

      // Update _access on each video and re-render if anything changed
      // Only 'full' unlocks the play button; everything else shows payment gate
      let changed = false;
      allVideos.forEach(v => {
        const next = v.courseId ? (courseAccess[v.courseId] || 'locked') : 'locked';
        if (v._access !== next) { v._access = next; changed = true; }
      });
      if (changed) renderVideos();
    } catch(e) { console.warn('checkUserAccess:', e); }
  }

  // ── Load course pricing for the payment gate ──
  async function loadCoursePricingForGate(v) {
    const loadEl = document.getElementById('rv-pay-loading');
    const optsEl = document.getElementById('rv-pay-options');
    const el = id => document.getElementById(id);

    const showPrice = (total, courseId) => {
      _gateTotalAmount = total;
      _gateCourse = { id: courseId || null };
      const fmtTotal = total > 0 ? '₹' + Number(total).toLocaleString('en-IN') : 'Contact Us';
      if (el('rv-total-price')) el('rv-total-price').textContent = fmtTotal;
      const payBtn = el('rv-pay-btn');
      if (payBtn && total > 0) payBtn.textContent = 'Pay ₹' + Number(total).toLocaleString('en-IN') + ' via Razorpay';
      if (loadEl) loadEl.style.display = 'none';
      if (optsEl) optsEl.style.display = '';
      el('rv-pay-btn')?.addEventListener('click', _gateInitiatePayment);
    };

    try {
      // ── Priority 1: recording's own total_amount (set by admin in DB) ──
      if (v.totalPrice != null && v.totalPrice > 0) {
        showPrice(v.totalPrice, v.courseId);
        return;
      }

      // ── Priority 2: calculate from recording's base_amount + 18% GST ──
      if (v.basePrice != null && v.basePrice > 0) {
        const total = Math.round(v.basePrice * 1.18);
        showPrice(total, v.courseId);
        return;
      }

      // ── Priority 3: fall back to course_pricing table ──
      const courseId = v.courseId || null;
      if (courseId && window.supabaseConfig) {
        const { data } = await window.supabaseConfig.client
          .from('course_pricing')
          .select('sale_price,list_price,is_active')
          .eq('course_id', courseId)
          .order('is_active', { ascending: false })
          .limit(1);
        const pricing = data?.[0] || null;
        if (pricing) {
          const base = pricing.sale_price ?? pricing.list_price ?? 0;
          const total = Math.round(base * 1.18);   // 18% GST (9% SGST + 9% CGST)
          showPrice(total, courseId);
          return;
        }
      }

      // ── No pricing found ──
      if (loadEl) loadEl.style.display = 'none';
      if (optsEl) {
        optsEl.innerHTML = `<p style="color:var(--txt3);font-size:.85rem;margin-bottom:1rem;">Pricing not available for this session.</p><a href="courses" style="color:#7c5cfc;font-weight:700;">Browse courses to enroll →</a>`;
        optsEl.style.display = '';
      }
    } catch(e) {
      console.warn('Pricing load error:', e);
      if (loadEl) loadEl.style.display = 'none';
      if (optsEl) { optsEl.innerHTML = '<a href="courses" style="color:#7c5cfc;font-weight:700;">Browse courses to enroll →</a>'; optsEl.style.display = ''; }
    }
  }

  async function _gateInitiatePayment() {
    const btn = document.getElementById('rv-pay-btn');
    if (!btn) return;

    // Razorpay requires HTTPS — fail gracefully on file:// protocol
    if (window.location.protocol === 'file:') {
      _showGateError('Payment requires a hosted site (HTTPS). Please access SkillUpNow via its web URL, not a local file.');
      return;
    }

    if (!window.supabaseConfig) return;
    const { data: { session } } = await window.supabaseConfig.client.auth.getSession();
    const user = session?.user;
    if (!user) {
      document.getElementById('rv-access-gate')?.remove();
      if (_gateVideo) window._pendingVideoId = _gateVideo.id;
      window.profileNav?.openLoginModal?.();
      return;
    }
    if (!_gateCourse) { window.location.href = 'courses'; return; }

    const totalAmount = _gateTotalAmount;
    if (!totalAmount || totalAmount <= 0) {
      _showGateError('Could not calculate payment amount. Please try again or contact support.');
      return;
    }

    if (typeof window.Razorpay === 'undefined') {
      _showGateError('Payment gateway failed to load. Please check your internet connection and refresh the page.');
      return;
    }

    btn.disabled = true; btn.textContent = 'Processing…';
    try {
      const options = {
        key: 'rzp_live_ILgsSZCZoFMQjO',
        amount: totalAmount * 100,
        currency: 'INR',
        name: 'SkillUpNow',
        description: _gateVideo?.title || 'Course Enrollment',
        image: '../icon/logo.png',
        prefill: {
          name: user.user_metadata?.full_name || '',
          email: user.email,
          contact: user.user_metadata?.phone || ''
        },
        notes: { course_id: _gateCourse?.id || '', video_title: _gateVideo?.title || '' },
        theme: { color: '#7c5cfc' },
        modal: {
          ondismiss: () => {
            btn.disabled = false;
            btn.textContent = 'Pay ₹' + Number(totalAmount).toLocaleString('en-IN') + ' via Razorpay';
          }
        },
        handler: async (response) => {
          btn.textContent = 'Processing…';
          try {
            // Upsert enrollment
            const { data: enroll, error: enrollErr } = await window.supabaseConfig.client
              .from('enrollments').upsert({
                student_user_id: user.id, course_id: _gateCourse.id,
                pricing_id: null,
                enrollment_status: 'active', access_status: 'active',
                net_amount: totalAmount, paid_amount: totalAmount, due_amount: 0,
              }, { onConflict: 'student_user_id,course_id' }).select().maybeSingle();
            if (enrollErr) console.warn('Enrollment upsert:', enrollErr.message);
            // Record payment
            const { error: payErr } = await window.supabaseConfig.client.from('payments').insert({
              student_user_id: user.id,
              enrollment_id: enroll?.id || null,
              course_id: _gateCourse.id,
              amount: totalAmount,
              payment_method: 'gateway_link',
              payment_gateway: 'razorpay',
              gateway_order_id: response.razorpay_order_id || null,
              gateway_payment_id: response.razorpay_payment_id || null,
              gateway_signature: response.razorpay_signature || null,
              transaction_reference: response.razorpay_payment_id || null,
              payment_status: 'completed',
              paid_at: new Date().toISOString(),
            });
            if (payErr) console.warn('Payment record:', payErr.message);
          } catch(dbErr) { console.warn('DB record error:', dbErr); }
          _showRvToast('Payment successful! Enjoy your session.', 'success');
          // Update card badge immediately
          if (_gateVideo?.courseId) {
            const vid = allVideos.find(x => x.id === _gateVideo.id);
            if (vid) { vid._access = 'full'; renderVideos(); }
          }
          document.getElementById('rv-access-gate')?.remove();
          // Fetch video URL now that payment is confirmed, then play
          if (_gateVideo) {
            const { data: rec } = await window.supabaseConfig.client
              .from('live_recordings').select('external_url').eq('id', _gateVideo.id).single();
            if (rec?.external_url) _gateVideo.videoUrl = rec.external_url;
            playVideo(_gateVideo);
          }
        },
      };
      const rzp = new window.Razorpay(options);
      rzp.on('payment.failed', (resp) => {
        btn.disabled = false;
        btn.textContent = 'Retry Payment';
        const msg = resp?.error?.description || resp?.error?.reason || 'Payment was declined. Please try a different payment method.';
        _showGateError(msg);
      });
      rzp.open();
    } catch(e) {
      console.error(e);
      btn.disabled = false;
      btn.textContent = 'Pay Now via Razorpay';
      _showGateError(e.message || 'An unexpected error occurred. Please try again.');
    }
  }

  function _showGateError(msg) {
    const gate = document.getElementById('rv-access-gate');
    if (!gate) return;
    let err = gate.querySelector('#rv-gate-err');
    if (!err) {
      err = document.createElement('div');
      err.id = 'rv-gate-err';
      err.style.cssText = 'background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.3);border-radius:10px;padding:.55rem .75rem;font-size:.8rem;color:#f87171;margin-top:.6rem;text-align:left;line-height:1.5;';
      const payBtn = document.getElementById('rv-pay-btn');
      payBtn?.parentNode?.insertBefore(err, payBtn?.nextSibling);
    }
    err.textContent = msg;
    setTimeout(() => err?.remove(), 8000);
  }

  // ── Play video in modal (paid users only) ──
  function playVideo(v) {
    const modal = document.getElementById('rv-modal');
    const videoArea = document.getElementById('rv-modal-video');
    document.getElementById('rv-modal-title').textContent = v.title;
    document.getElementById('rv-modal-mentor').textContent = '📚 ' + (v.courseTitle || 'SkillUpNow');
    document.getElementById('rv-modal-dur').textContent = v.duration !== '—' ? '⏱ ' + v.duration : '';
    document.getElementById('rv-modal-cat').textContent = v.tags?.[0] ? '🏷 ' + v.tags[0] : '';
    if (v.videoUrl && v.videoUrl.startsWith('http')) {
      const isYT   = v.videoUrl.includes('youtube') || v.videoUrl.includes('youtu.be');
      const isDrive = v.videoUrl.includes('drive.google.com');
      if (isYT) {
        // YouTube embed: disable related videos, branding, and download button
        const ytId = v.videoUrl.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
        videoArea.innerHTML = `<iframe
          src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&disablekb=0&fs=1"
          allow="autoplay; fullscreen"
          allowfullscreen
          style="width:100%;height:100%;border:none;pointer-events:auto;">
        </iframe>`;
      } else if (isDrive) {
        // Google Drive embed: preview mode hides download button in the Drive UI
        const driveId = v.videoUrl.match(/\/d\/([a-zA-Z0-9_-]+)/)?.[1];
        const embedSrc = driveId
          ? `https://drive.google.com/file/d/${driveId}/preview`
          : v.videoUrl;
        videoArea.innerHTML = `<iframe
          src="${embedSrc}"
          allow="autoplay; fullscreen"
          allowfullscreen
          style="width:100%;height:100%;border:none;pointer-events:auto;">
        </iframe>`;
      } else {
        // Native video: strip all download/remote controls
        videoArea.innerHTML = `<video
          controls autoplay playsinline
          src="${v.videoUrl}"
          controlslist="nodownload noremoteplayback"
          disablepictureinpicture
          disableremoteplayback
          style="width:100%;height:100%;"
          oncontextmenu="return false;">
        </video>`;
      }
    } else {
      videoArea.innerHTML = `
        <div class="rv-modal-placeholder">
          <div class="big-icon">${v.icon}</div>
          <div style="font-size:1rem;font-weight:700;color:rgba(255,255,255,.7);">${v.title}</div>
          <div style="font-size:.82rem;color:rgba(255,255,255,.4);max-width:300px;text-align:center;line-height:1.6;">
            Recording not yet available for this session. Check back soon.
          </div>
        </div>`;
    }
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function openModal(id) { handleWatchClick(id); }

  function closeModal() {
    const modal = document.getElementById('rv-modal');
    modal.classList.remove('open');
    document.body.style.overflow = '';
    document.getElementById('rv-modal-video').innerHTML = '<div class="rv-modal-placeholder"><div class="big-icon">🎬</div><div>Loading…</div></div>';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── Load recordings from live_recordings table (DB only) ──
  async function loadVideos() {
    showSkeleton();
    try {
      // Wait for supabase to init if needed
      if (!window.supabaseConfig?.client) {
        await new Promise(r => setTimeout(r, 800));
      }
      if (!window.supabaseConfig?.client) throw new Error('Database not ready');

      // Select ALL published recordings for public listing.
      // external_url is intentionally excluded here — it is fetched
      // separately by handleWatchClick ONLY after access is verified,
      // so the video URL is never sent to users who haven't paid.
      const { data, error } = await window.supabaseConfig.client
        .from('live_recordings')
        .select('id,title,provider_name,course_id,created_at,base_amount,gst_percentage,total_amount,courses(title,course_pricing(sale_price,list_price,is_active))')
        .order('created_at', { ascending: false });

      if (error) throw error;

      if (!data || !data.length) {
        document.getElementById('rv-grid').innerHTML = `
          <div class="rv-empty">
            <div class="rv-empty-icon">🎬</div>
            <p style="font-size:1.05rem;font-weight:600;color:var(--txt3);margin-bottom:.5rem;">No recordings yet</p>
            <p style="font-size:.88rem;">Recorded sessions will appear here after live classes.</p>
          </div>`;
        return;
      }

      allVideos = data.map(r => {
        const { icon, gradient } = videoMeta(r.provider_name);
        const courseTitle = r.courses?.title || '';
        const filterKey = courseTitle.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        // Resolve price: recording-level base_amount → course pricing → null
        const activePricing = (r.courses?.course_pricing || []).find(p => p.is_active);
        const basePrice = r.base_amount ?? activePricing?.sale_price ?? activePricing?.list_price ?? null;
        const gstPct = r.gst_percentage ?? 18;
        const totalPrice = r.total_amount ?? (basePrice != null ? Math.round(basePrice * (1 + gstPct / 100)) : null);
        return {
          id: r.id,
          title: r.title || 'Session Recording',
          courseTitle,
          filterKey: filterKey || 'session',
          duration: r.duration_minutes ? r.duration_minutes + ' min' : '—',
          icon,
          gradient,
          isNew: (Date.now() - new Date(r.created_at).getTime()) < 7 * 24 * 3600 * 1000,
          tags: courseTitle ? [courseTitle] : [],
          videoUrl: null, // fetched after access verification, not during listing
          courseId: r.course_id || null,
          thumbnail: r.thumbnail_url || null,
          basePrice,
          gstPct,
          totalPrice,
        };
      });

      buildFilterButtons();
      renderVideos();
      checkUserAccess(); // async: enriches badges for logged-in users
    } catch(e) {
      console.error('loadVideos error:', e);
      document.getElementById('rv-grid').innerHTML = `
        <div class="rv-empty">
          <div class="rv-empty-icon">⚠️</div>
          <p style="font-size:1.05rem;font-weight:600;color:var(--txt3);margin-bottom:.5rem;">Could not load recordings</p>
          <p style="font-size:.88rem;">Check your connection and <a href="" style="color:var(--v1);">refresh</a>.</p>
        </div>`;
    }
  }

  // Init
  document.addEventListener('DOMContentLoaded', loadVideos);
  </script>
</body>
</html>
